plugins {
    id 'java-gradle-plugin' // Apply the Java Gradle plugin development plugin to add support for developing Gradle plugins
    id 'org.jetbrains.kotlin.jvm' version '1.6.21' // Apply the Kotlin JVM plugin to add support for Kotlin.
    id 'com.gradle.plugin-publish' version '2.0.0' // Apply gradle publish plugin
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        url uri('/Volumes/Data/Projects/local-maven-repo') // Adjust the path as needed
    }
}

dependencies {
    implementation gradleTestKit()
    implementation platform('org.jetbrains.kotlin:kotlin-bom')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit'
}




group = 'com.edfapay'
version = "2.0.1"

pluginBundle {
    website = 'https://edfapay.com'
    vcsUrl = 'https://github.com/edfapay/edfapay.softpos.gradle'
    tags = ['edfapay', 'edfapay gradle', 'edfapay tools plugins', 'edfapay tools gradle', 'edfapay softpos configuration', 'edfapay softpos partners configs']
}

gradlePlugin {
    plugins {
        settings {
            id = 'com.edfapay.softpos.settings'
            displayName = 'EdfaPay repository plugin'
            description = 'A Gradle settings plugin that automatically configures your project\'s repositories. It centralizes repository management by adding the Edfapay private repository access, This can be disabled by setting repositoriesMode to PREFER_PROJECT.'
            implementationClass = 'tools.Settings'
        }
        build {
            id = 'com.edfapay.softpos.build'
            displayName = 'EdfaPay gradle tools plugin'
            description = 'A Gradle plugin that configures your project to use Edfapay\'s private repository and helps to configure Edfapay SDK dependencies'
            implementationClass = 'tools.Build'
        }
    }
}